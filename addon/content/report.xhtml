<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-platform/content/zotero.css"?>
<?xml-stylesheet href="chrome://__addonRef__/content/refwright.css" type="text/css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="refwright-report"
  class="zotero-dialog refwright-window"
  width="680"
  height="420"
  persist="screenX screenY width height"
>
  <dialog id="refwright-report-dialog" buttons="cancel,accept">
    <html:div class="refwright-shell">
      <html:progress id="bar" max="1" value="0"></html:progress>
      <html:div class="refwright-scroll">
        <html:table class="refwright-table">
          <html:thead
            ><html:tr
              ><html:th class="state"></html:th><html:th id="c1"></html:th
              ><html:th id="c2"></html:th></html:tr
          ></html:thead>
          <html:tbody id="rows"></html:tbody>
        </html:table>
      </html:div>
      <html:div class="refwright-bar sub"
        ><html:span id="sum" class="refwright-muted"></html:span
      ></html:div>
    </html:div>
  </dialog>
  <script src="chrome://__addonRef__/content/scripts/ui-report.js" />
</window>
