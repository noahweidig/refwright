[project]
site_name = "refwright"
site_description = "Find PDFs, check retractions and citations, tag, and file papers in Zotero."
site_url = "https://noahweidig.github.io/refwright/"
repo_url = "https://github.com/noahweidig/refwright"
docs_dir = "docs"
site_dir = "site"
copyright = "AGPL-3.0-or-later"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    { "PDFs" = "pdfs.md" },
    { "Retractions and citations" = "integrity.md" },
    { "Tags" = "tags.md" },
    { "Collections" = "collections.md" },
  ] },
  { "Reference" = [
    { "Settings" = "settings.md" },
    { "AI providers" = "providers.md" },
    { "Write-back API" = "api.md" },
    { "Privacy" = "privacy.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

[project.theme]
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "content.code.copy",
  "content.tabs.link",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "lucide/git-branch"
logo = "lucide/book-marked"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options = { custom_icons = ["overrides/.icons"] }
