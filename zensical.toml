[project]
site_name = "refwright"
site_description = "Find PDFs, check retractions and citations, tag, and file papers in Zotero."
site_author = "Noah Weidig"
site_url = "https://noahweidig.github.io/refwright/"
repo_url = "https://github.com/noahweidig/refwright"
repo_name = "noahweidig/refwright"
docs_dir = "docs"
site_dir = "site"
copyright = "refwright is free and open source. AGPL-3.0-or-later."
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    { "PDFs" = "pdfs.md" },
    { "Retractions and citations" = "integrity.md" },
    { "Tags" = "tags.md" },
    { "Tag Manager" = "tag-manager.md" },
    { "Collections" = "collections.md" },
    { "Summaries and related items" = "insights.md" },
  ] },
  { "Reference" = [
    { "Settings" = "settings.md" },
    { "AI providers" = "providers.md" },
    { "Write-back API" = "api.md" },
    { "Privacy" = "privacy.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
favicon = "favicon.svg"
logo = "favicon.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
repo = "octicons/mark-github-16"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.options = { custom_icons = ["overrides/.icons"] }
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
